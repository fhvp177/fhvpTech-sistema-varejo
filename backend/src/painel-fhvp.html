<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel FHVP Tech</title>
<!-- Identidade compartilhada com o painel do revendedor. Ver /painel.css. -->
<!-- ⚠️ TODO caminho desta página é RELATIVO, e isso não é estilo: é o que faz
     ela funcionar em dois endereços ao mesmo tempo.

     Servida pelo backend em `/painel`, o diretório-base é `/`, então
     `painel.css` vira `/painel.css` e `revenda/login` vira `/revenda/login`.

     Servida em `fhvptech.com/painel-do-revendedor/` (o Worker do Cloudflare),
     o diretório-base é `/painel-do-revendedor/`, então os mesmos caminhos viram
     `/painel-do-revendedor/painel.css` e `/painel-do-revendedor/revenda/login`
     — que é exatamente o prefixo que o Worker remove antes de repassar ao Fly.

     Uma barra inicial em qualquer um deles quebra o segundo caso: o pedido sai
     para a raiz de fhvptech.com, onde o Worker não escuta, e a página abre sem
     estilo ou sem conseguir falar com a API. -->
<link rel="stylesheet" href="painel.css">
</head>
<body>

<div id="telaLogin">
  <form class="cartao-login" id="formLogin">
    <img class="logo-entrada" src="painel-logo.png" alt="FHVP Tech" width="104" height="104">
    <div class="marca" style="text-align:center">FHVP <span>Tech</span></div>
    <div class="selo">Administração</div>
    <p class="sub" style="text-align:center;margin-top:10px">Revendedores e lojas da rede.</p>
    <label for="campoSenha">Senha</label>
    <input id="campoSenha" type="password" autocomplete="current-password" spellcheck="false"
           placeholder="sua senha de administração">
    <p class="sub" style="margin:8px 0 0;font-size:13px">
      A sessão dura 12 horas e morre ao fechar a aba. Um deploy também derruba todas.
    </p>
    <div id="erroLogin" class="aviso erro" hidden style="margin-top:14px"></div>
    <button id="botaoEntrar" type="submit" style="width:100%;margin-top:18px">Entrar</button>
  </form>
</div>

<div id="telaApp" hidden>
  <header class="topo">
    <div class="marca">FHVP <span>Tech</span></div>
    <div class="crescer"></div>
    <button class="neutro pequeno" id="botaoAtualizar" type="button">Atualizar</button>
    <button class="neutro pequeno" id="botaoSair" type="button">Sair</button>
  </header>

  <main>
    <div class="abas" role="tablist">
      <button role="tab" id="abaRevendedores" aria-selected="true" type="button">Revendedores</button>
      <button role="tab" id="abaClientes" aria-selected="false" type="button">Lojas</button>
    </div>

    <div id="erroGeral" class="aviso erro" hidden style="margin-bottom:16px"></div>

    <section id="painelRevendedores">
      <div class="cards" id="cartoesRevenda"></div>
      <div class="painel"><div style="overflow-x:auto"><table>
        <thead><tr>
          <th>Revendedor</th><th>Validade</th><th>Situação</th>
          <th class="num">Lojas</th><th class="num">Ativas</th><th>Recuperação</th><th></th>
        </tr></thead>
        <tbody id="corpoRevendedores"></tbody>
      </table></div></div>
    </section>

    <section id="painelClientes" hidden>
      <div class="cards" id="cartoesClientes"></div>
      <div class="painel"><div style="overflow-x:auto"><table>
        <thead><tr>
          <th>Loja</th><th>Origem</th><th>Plano</th><th>Validade</th>
          <th class="num">Mensalidade</th>
          <th class="num">Notas</th><th class="num">Excedente</th><th>Situação</th><th></th>
        </tr></thead>
        <tbody id="corpoClientes"></tbody>
      </table></div></div>
    </section>
  </main>
</div>

<dialog id="dialogo" aria-labelledby="dialogoTitulo"></dialog>

<script src="painel-ui.js"></script>
<script>
(function () {
  'use strict'

  /**
   * ── O que esta tela guarda, e por quê ─────────────────────────────────────
   * Até aqui esta tela pedia um segredo do SERVIDOR colado à mão, e o mantinha
   * só na memória: recarregar a página exigia colar de novo. Era proteção
   * legítima, porque aquele segredo não expirava nem dava para revogar sem
   * redeploy — mas cobrou a conta no dia em que ninguém mais tinha o valor
   * anotado. O Fly não devolve o conteúdo de um secret.
   *
   * Agora a senha entra UMA vez e sai daqui como token de sessão: opaco, 12h de
   * validade, guardado no servidor apenas como hash. É isso que permitiu
   * afrouxar a regra — o que sobrevive a um F5 não é mais a credencial, e
   * qualquer deploy ou troca de senha o derruba na hora.
   *
   * Mesmo desenho do painel do revendedor. A diferença que restava (lá cada um
   * tem conta própria; aqui a conta é do servidor) deixou de importar quando a
   * senha virou um segredo do Fly, trocável sem tocar no código.
   */
  // Guardado por ABA, e não pelo navegador: a sessão morre ao fechar a aba, mas
  // sobrevive a um F5 — que era a reclamação de quem colava o segredo à mão.
  // Painel que abre todas as lojas não deve ficar destrancado num PC
  // compartilhado só porque alguém não deslogou.
  const CHAVE_SESSAO = 'fhvp_admin_token'
  let token = sessionStorage.getItem(CHAVE_SESSAO) || ''
  let revendedores = []
  let clientes = []

  const $ = (id) => document.getElementById(id)
  const dinheiro = (centavos) =>
    (Number(centavos || 0) / 100).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' })
  const dataBr = (iso) => (iso ? String(iso).slice(0, 10).split('-').reverse().join('/') : 'sem data')

  /**
   * Dias inteiros de `de` ate `ate`, ambos no formato AAAA-MM-DD.
   *
   * Monta as datas com `T00:00` para o horario local. `new Date('2026-09-03')`
   * sem hora e lido como UTC, e no Brasil isso vira 21h do dia ANTERIOR: a
   * conta erraria por um dia toda tarde. Mesma armadilha ja documentada no app.
   */
  function diasEntre(de, ate) {
    const a = new Date(de + 'T00:00')
    const b = new Date(ate + 'T00:00')
    if (isNaN(a) || isNaN(b)) return null
    return Math.round((b - a) / 86400000)
  }

  // Espelha o padrao do backend (o ultimo `?? 10000` da rota /cobranca). Aqui
  // ele so ROTULA a coluna quando a loja nao tem preco proprio — quem decide o
  // valor cobrado continua sendo o servidor. Se um dia o padrao mudar la, esta
  // constante vira mentira na tela: e o unico ponto a acertar junto.
  const PRECO_PADRAO_CENTAVOS = 10000

  function mostrarErro(el, msg) {
    if (!msg) { el.hidden = true; el.textContent = ''; return }
    el.textContent = msg
    el.hidden = false
  }

  async function api(caminho, opcoes) {
    const o = opcoes || {}
    const cab = { 'Content-Type': 'application/json' }
    if (token) cab.Authorization = 'Bearer ' + token
    let resp
    try {
      resp = await fetch(caminho.replace(/^\//, ''), {
        method: o.metodo || 'GET',
        headers: cab,
        body: o.corpo ? JSON.stringify(o.corpo) : undefined
      })
    } catch (e) {
      return { ok: false, erro: 'sem conexão com o servidor' }
    }
    let dados = {}
    try { dados = await resp.json() } catch (e) { /* resposta sem corpo */ }
    // 401 em QUALQUER rota derruba a sessão — menos no próprio login, onde 401
    // é só "senha errada" e mandar para a tela de entrada apagaria a mensagem
    // antes de a pessoa lê-la.
    if (resp.status === 401 && !caminho.startsWith('/admin-login')) {
      sair('sua sessão expirou — entre novamente')
      return { ok: false, erro: 'não autorizado' }
    }
    return resp.ok ? { ok: true, dados } : { ok: false, erro: dados.erro || ('erro ' + resp.status) }
  }

  /**
   * Diálogo único da página.
   *
   * Nenhuma caixa nativa do navegador entra aqui — nem `alert`, nem `confirm`,
   * nem `prompt`. Elas travam o processo, não dá para estilizar, e o texto sai
   * com o domínio do servidor em cima, o que numa tela de administração parece
   * golpe. Regra da casa; este arquivo a segue como o painel do revendedor.
   *
   * Erro NÃO fecha o diálogo e devolve o cursor ao campo culpado — quem errou
   * um número não deve ter que reabrir tudo e redigitar o resto.
   */
  function abrirModal(opcoes) {
    const o = opcoes || {}
    return new Promise((resolver) => {
      const focoAnterior = document.activeElement
      const caixa = $('dialogo')
      caixa.replaceChildren()

      const titulo = document.createElement('h2')
      titulo.id = 'dialogoTitulo'
      titulo.textContent = o.titulo || ''
      caixa.appendChild(titulo)

      if (o.subtitulo) {
        const p = document.createElement('p')
        p.className = 'sub'
        p.style.margin = '0'
        p.textContent = o.subtitulo
        caixa.appendChild(p)
      }
      if (o.aviso) {
        const a = document.createElement('div')
        a.className = 'aviso ' + (o.avisoTipo || 'alerta')
        a.style.marginTop = '14px'
        a.textContent = o.aviso
        caixa.appendChild(a)
      }

      const entradas = {}
      for (const campo of (o.campos || [])) {
        const rot = document.createElement('label')
        rot.textContent = campo.rotulo
        rot.htmlFor = 'campo_' + campo.id
        caixa.appendChild(rot)

        const inp = document.createElement('input')
        inp.id = 'campo_' + campo.id
        inp.type = campo.tipo || 'text'
        inp.value = campo.valor == null ? '' : String(campo.valor)
        if (campo.dica) inp.placeholder = campo.dica
        if (campo.tipo === 'number') { inp.inputMode = 'numeric' }
        inp.autocomplete = 'off'
        caixa.appendChild(inp)
        entradas[campo.id] = inp

        if (campo.ajuda) {
          const p = document.createElement('p')
          p.className = 'sub'
          p.style.margin = '6px 0 0'
          p.style.fontSize = '13px'
          p.textContent = campo.ajuda
          caixa.appendChild(p)
        }
      }

      const erro = document.createElement('div')
      erro.className = 'aviso erro'
      erro.hidden = true
      erro.style.marginTop = '14px'
      caixa.appendChild(erro)

      const botoes = document.createElement('div')
      botoes.className = 'modal-botoes'
      const cancelar = document.createElement('button')
      cancelar.type = 'button'
      cancelar.className = 'neutro'
      cancelar.textContent = o.rotuloCancelar || 'Cancelar'
      const confirmar = document.createElement('button')
      confirmar.type = 'button'
      confirmar.className = o.perigo ? 'perigo-forte' : ''
      confirmar.textContent = o.rotuloConfirmar || 'Confirmar'
      botoes.append(cancelar, confirmar)
      caixa.appendChild(botoes)

      let vivo = true
      function fechar(resultado) {
        if (!vivo) return
        vivo = false
        caixa.close()
        caixa.removeEventListener('cancel', aoCancelar)
        caixa.removeEventListener('click', aoClicarFora)
        caixa.removeEventListener('keydown', aoTeclar)
        // Devolve o foco a quem abriu — sem isto o leitor de tela (e o Tab)
        // recomeçam do topo da página a cada ação.
        if (focoAnterior && focoAnterior.focus) focoAnterior.focus()
        resolver(resultado)
      }
      const aoCancelar = (ev) => { ev.preventDefault(); fechar(null) }
      const aoClicarFora = (ev) => { if (ev.target === caixa) fechar(null) }
      const aoTeclar = (ev) => {
        if (ev.key === 'Enter' && ev.target.tagName === 'INPUT') { ev.preventDefault(); tentar() }
      }

      async function tentar() {
        const valores = {}
        for (const k of Object.keys(entradas)) valores[k] = entradas[k].value.trim()
        confirmar.disabled = true
        mostrarErro(erro, '')
        let problema = null
        try {
          problema = o.aoConfirmar ? await o.aoConfirmar(valores) : null
        } catch (e) {
          problema = { mensagem: (e && e.message) || 'falhou' }
        }
        confirmar.disabled = false
        if (problema) {
          mostrarErro(erro, problema.mensagem || 'não deu certo')
          const alvo = problema.campo && entradas[problema.campo]
          if (alvo) { alvo.focus(); alvo.select && alvo.select() }
          return
        }
        fechar(valores)
      }

      cancelar.addEventListener('click', () => fechar(null))
      confirmar.addEventListener('click', tentar)
      caixa.addEventListener('cancel', aoCancelar)
      caixa.addEventListener('click', aoClicarFora)
      caixa.addEventListener('keydown', aoTeclar)

      caixa.showModal()
      const primeiro = Object.keys(entradas)[0]
      if (primeiro) entradas[primeiro].focus()
      else confirmar.focus()
    })
  }

  // ── Login ────────────────────────────────────────────────────────────────

  $('formLogin').addEventListener('submit', async (ev) => {
    ev.preventDefault()
    const botao = $('botaoEntrar')
    const senha = $('campoSenha').value
    if (!senha) return
    botao.disabled = true
    mostrarErro($('erroLogin'), '')

    // A senha vai UMA vez, troca por um token de sessão, e não volta mais a
    // sair daqui. Nenhum pedido seguinte a carrega.
    const login = await api('/admin-login', { metodo: 'POST', corpo: { senha } })
    botao.disabled = false

    // Limpo antes de qualquer desvio: errar a senha não deixa ela parada no
    // DOM, onde uma inspeção casual a mostraria em claro.
    $('campoSenha').value = ''

    if (!login.ok) {
      mostrarErro($('erroLogin'), login.erro || 'não foi possível entrar')
      $('campoSenha').focus()
      return
    }

    token = login.dados.token
    sessionStorage.setItem(CHAVE_SESSAO, token)
    await abrirPainel()
  })

  /**
   * Mostra o painel com a sessão que já está em mãos.
   *
   * Separado do submit porque serve a DOIS caminhos: o login e a retomada
   * depois de um F5. Sem isso, recarregar a página com sessão válida cairia na
   * tela de entrada — que é exatamente o incômodo que este trabalho remove.
   */
  async function abrirPainel() {
    const r = await api('/admin/revendedores')
    if (!r.ok) {
      // Sessão morta (deploy, 12h, senha trocada). O `sair` já foi chamado pelo
      // 401 dentro do api(); aqui só não seguimos para a tela de dentro.
      return false
    }
    $('telaLogin').hidden = true
    $('telaApp').hidden = false
    aplicar(r.dados)
    await carregarClientes()
    return true
  }

  function sair(motivo) {
    // Avisa o servidor para o token morrer agora, e não só quando expirar.
    // Sem `await`: a tela não deve esperar a rede para destrancar o operador.
    if (token) {
      const morrendo = token
      fetch('admin-logout', {
        method: 'POST',
        headers: { Authorization: 'Bearer ' + morrendo }
      }).catch(() => {})
    }
    sessionStorage.removeItem(CHAVE_SESSAO)
    token = ''
    revendedores = []
    clientes = []
    $('telaApp').hidden = true
    $('telaLogin').hidden = false
    mostrarErro($('erroLogin'), motivo || '')
  }
  $('botaoSair').addEventListener('click', () => sair(''))

  // ── Abas ─────────────────────────────────────────────────────────────────

  function trocarAba(qual) {
    const ehRevenda = qual === 'revendedores'
    $('abaRevendedores').setAttribute('aria-selected', String(ehRevenda))
    $('abaClientes').setAttribute('aria-selected', String(!ehRevenda))
    $('painelRevendedores').hidden = !ehRevenda
    $('painelClientes').hidden = ehRevenda
  }
  $('abaRevendedores').addEventListener('click', () => trocarAba('revendedores'))
  $('abaClientes').addEventListener('click', () => trocarAba('clientes'))

  // ── Carregar ─────────────────────────────────────────────────────────────

  async function carregarRevendedores() {
    const r = await api('/admin/revendedores')
    if (!r.ok) { mostrarErro($('erroGeral'), r.erro); return }
    aplicar(r.dados)
  }
  function aplicar(dados) {
    revendedores = (dados && dados.revendedores) || []
    mostrarErro($('erroGeral'), '')
    desenharRevendedores()
  }

  /**
   * Depois de uma acao, a tabela inteira e redesenhada e a linha que mudou fica
   * indistinguivel das outras. `destacar` guarda qual foi, e o desenho aplica
   * `anim-linha-entra` nela: um clarao que some.
   *
   * Informa, nao enfeita. Sem isso a pessoa fecha o modal e precisa procurar na
   * tabela se o que ela pediu aconteceu. Segue a regra da casa: animacao que
   * nao conta nada e imposto cobrado toda vez.
   */
  let destacar = null

  async function carregarClientes(idDestaque) {
    if (idDestaque) destacar = idDestaque
    const r = await api('/admin/clientes')
    if (!r.ok) { mostrarErro($('erroGeral'), r.erro); return }
    clientes = (r.dados && r.dados.clientes) || []
    desenharClientes()
    destacar = null
  }

  async function recarregar(idDestaque) {
    if (idDestaque) destacar = idDestaque
    await carregarRevendedores()
    await carregarClientes()
  }
  $('botaoAtualizar').addEventListener('click', recarregar)

  // ── Revendedores ─────────────────────────────────────────────────────────

  function situacaoRevendedor(rv) {
    if (rv.bloqueado) return { texto: 'Bloqueado', classe: 'erro' }
    if (!rv.validade) return { texto: 'Sem validade', classe: 'alerta' }
    const hoje = new Date().toISOString().slice(0, 10)
    if (rv.validade < hoje) return { texto: 'Vencido', classe: 'alerta' }
    return { texto: 'Em dia', classe: 'ok' }
  }

  function desenharRevendedores() {
    const ativos = revendedores.reduce((s, r) => s + (r.clientesAtivos || 0), 0)
    const lojas = revendedores.reduce((s, r) => s + (r.clientes || 0), 0)
    const bloqueados = revendedores.filter((r) => r.bloqueado).length
    // O tom do ultimo cartao acompanha o numero: zero suspenso e uma boa
    // noticia em cinza, e um suspenso e um alerta que merece o olho.
    $('cartoesRevenda').replaceChildren(
      cartao('Revendedores', String(revendedores.length), 'handshake'),
      cartao('Lojas na rede', String(lojas), 'store'),
      cartao('Lojas ativas', String(ativos), 'circle-check-big', ativos > 0 ? 'ok' : 'neutro'),
      cartao('Suspensos', String(bloqueados), 'ban', bloqueados > 0 ? 'erro' : 'neutro')
    )

    const corpo = $('corpoRevendedores')
    if (revendedores.length === 0) {
      const tr = document.createElement('tr')
      const td = document.createElement('td')
      td.colSpan = 7; td.className = 'vazio'
      td.textContent = 'Nenhum revendedor cadastrado ainda.'
      tr.appendChild(td); corpo.replaceChildren(tr)
      return
    }

    corpo.replaceChildren(...revendedores.map((rv) => {
      const tr = document.createElement('tr')
      if (destacar === rv.revendedorId) tr.className = 'anim-linha-entra'
      const sit = situacaoRevendedor(rv)

      const tdNome = document.createElement('td')
      const ident = document.createElement('div'); ident.className = 'identidade'
      const nome = document.createElement('span'); nome.className = 'nome'
      nome.textContent = rv.nome || rv.revendedorId
      const id = document.createElement('span'); id.className = 'codigo'
      id.textContent = rv.revendedorId
      ident.append(nome, id)
      tdNome.appendChild(ident)

      const tdValidade = document.createElement('td')
      tdValidade.textContent = dataBr(rv.validade)

      const tdSit = document.createElement('td')
      const et = document.createElement('span')
      et.className = 'etiqueta ' + sit.classe
      et.textContent = sit.texto
      tdSit.appendChild(et)

      const tdLojas = document.createElement('td'); tdLojas.className = 'num'
      tdLojas.textContent = String(rv.clientes ?? 0)
      const tdAtivas = document.createElement('td'); tdAtivas.className = 'num'
      tdAtivas.textContent = String(rv.clientesAtivos ?? 0)

      const tdRec = document.createElement('td')
      const etRec = document.createElement('span')
      const podeRec = rv.podeRecuperarSenha
      etRec.className = 'etiqueta ' + (podeRec ? 'ok' : 'alerta')
      etRec.appendChild(icone(podeRec ? 'mail-check' : 'mail-x'))
      // "sem e-mail" e um problema pendente, nao um estado neutro: sem ele o
      // revendedor que perder a senha vira telefonema para a FHVP.
      etRec.appendChild(document.createTextNode(podeRec ? 'E-mail cadastrado' : 'Sem e-mail'))
      tdRec.appendChild(etRec)

      const tdAcoes = document.createElement('td'); tdAcoes.className = 'acoes'
      tdAcoes.appendChild(menuAcoes([
        { texto: 'Ajustar validade', icone: 'calendar-days', aoClicar: () => modalValidade(rv) },
        { texto: 'Redefinir senha', icone: 'key-round', aoClicar: () => modalSenha(rv) },
        '-',
        {
          texto: rv.bloqueado ? 'Reativar' : 'Suspender emissão',
          icone: rv.bloqueado ? 'play' : 'pause',
          aoClicar: () => modalBloqueio(rv)
        },
        { texto: 'Bloquear rede', icone: 'octagon-alert', perigo: true, aoClicar: () => modalCortar(rv) }
      ]))

      tr.append(tdNome, tdValidade, tdSit, tdLojas, tdAtivas, tdRec, tdAcoes)
      return tr
    }))
  }


  function botao(texto, classe, aoClicar) {
    const b = document.createElement('button')
    b.type = 'button'
    b.className = 'pequeno ' + (classe || '')
    b.textContent = texto
    b.addEventListener('click', aoClicar)
    return b
  }

  async function modalValidade(rv) {
    const r = await abrirModal({
      titulo: 'Somar dias ao revendedor',
      subtitulo: rv.nome + ' — vence em ' + dataBr(rv.validade),
      campos: [{ id: 'dias', rotulo: 'Dias a somar', tipo: 'number', valor: 30,
        ajuda: 'A validade dele é o TETO das chaves que ele emite: nenhuma loja dele pode passar desta data.' }],
      rotuloConfirmar: 'Somar',
      aoConfirmar: async (v) => {
        const dias = Number(v.dias)
        if (!Number.isInteger(dias) || dias <= 0) return { campo: 'dias', mensagem: 'informe um número inteiro de dias' }
        const resp = await api('/admin/revendedor/' + encodeURIComponent(rv.revendedorId) + '/validade',
          { metodo: 'POST', corpo: { dias } })
        return resp.ok ? null : { mensagem: resp.erro }
      }
    })
    if (r) await recarregar(rv.revendedorId)
  }

  /**
   * Suspender ≠ bloquear a rede, e a tela precisa deixar isso óbvio.
   *
   * Suspender NÃO desliga as lojas do revendedor. Elas seguem funcionando até
   * a validade de cada uma, e a carteira dele encolhe sozinha no ritmo do
   * ciclo. É a ação do dia a dia, para atraso de pagamento.
   *
   * Bloquear a rede é outra coisa: desliga as lojas na hora, mora noutro item
   * do menu e exige o código digitado. Ver `modalCortar`.
   *
   * ── Sobre os nomes ─────────────────────────────────────────────────────────
   * Estas ações se chamavam "Estrangular" e "Cortar". Descrever cobrança de
   * parceiro com esse vocabulário não combina com o produto, e a tela é lida
   * por quem administra a operação todo dia. "Suspender emissão" e "Bloquear
   * rede" dizem exatamente o que acontece, sem precisar de metáfora.
   */
  async function modalBloqueio(rv) {
    const bloqueando = !rv.bloqueado
    const r = await abrirModal({
      titulo: bloqueando
        ? 'Suspender a emissão de ' + rv.nome + '?'
        : 'Reativar ' + rv.nome + '?',
      aviso: bloqueando
        ? 'As lojas dele CONTINUAM funcionando até a validade de cada uma. O que para é o painel: ele deixa de emitir e de renovar chaves, e a carteira vence sozinha. Pagar não desfaz isto.'
        : 'Ele volta a emitir e renovar chaves imediatamente.',
      // 'aviso' e nao 'erro': suspender e reversivel e faz parte do ciclo
      // normal de cobranca. Vermelho aqui gastaria o alarme que a acao de
      // baixo precisa.
      avisoTipo: bloqueando ? 'alerta' : 'ok',
      campos: bloqueando
        ? [{ id: 'motivo', rotulo: 'Motivo', dica: 'ex.: mensalidade em atraso desde 10/09',
             ajuda: 'Fica gravado para quem for destravar depois entender o porquê.' }]
        : [],
      rotuloConfirmar: bloqueando ? 'Suspender' : 'Reativar',
      perigo: bloqueando,
      aoConfirmar: async (v) => {
        const resp = await api('/admin/revendedor/' + encodeURIComponent(rv.revendedorId) + '/bloqueio',
          { metodo: 'POST', corpo: { bloqueado: bloqueando, motivo: v.motivo || undefined } })
        return resp.ok ? null : { mensagem: resp.erro }
      }
    })
    if (r) await recarregar(rv.revendedorId)
  }

  async function modalSenha(rv) {
    const r = await abrirModal({
      titulo: 'Definir senha do painel',
      subtitulo: rv.nome,
      aviso: 'Senha não é recuperável, só redefinível — nem a FHVP consegue ler a atual. Isto aqui é o socorro que sempre funciona quando ele perde o acesso.',
      avisoTipo: 'alerta',
      campos: [{ id: 'senha', rotulo: 'Nova senha', tipo: 'password',
        ajuda: 'Ele pode trocar depois, pelo próprio painel.' }],
      rotuloConfirmar: 'Definir',
      aoConfirmar: async (v) => {
        if (!v.senha) return { campo: 'senha', mensagem: 'informe a senha' }
        const resp = await api('/admin/revendedor/' + encodeURIComponent(rv.revendedorId) + '/senha',
          { metodo: 'POST', corpo: { senha: v.senha } })
        return resp.ok ? null : { campo: 'senha', mensagem: resp.erro }
      }
    })
    if (r) await recarregar(rv.revendedorId)
  }

  /**
   * A ação mais grave da tela.
   *
   * Bloquear a rede desliga TODAS as lojas do revendedor na hora. É o oposto
   * de suspender, que respeita o ciclo de cada loja. Existe para fraude, e por
   * isso o backend exige o código digitado no corpo do pedido (`confirmarId`):
   * um clique errado não pode parar a operação de um parceiro.
   *
   * A confirmação por digitação é chata de propósito. É o único lugar da tela
   * onde a chatice é a funcionalidade.
   */
  async function modalCortar(rv) {
    const r = await abrirModal({
      titulo: 'Bloquear a rede de ' + rv.nome + '?',
      aviso: 'Todas as lojas deste revendedor param de funcionar imediatamente. ' +
        'Diferente de suspender, que apenas impede chaves novas e deixa cada loja ' +
        'operar até a validade dela. Use para fraude, não para atraso de pagamento.',
      avisoTipo: 'erro',
      campos: [{ id: 'confirmar', rotulo: 'Digite o código do revendedor para confirmar',
        dica: rv.revendedorId, ajuda: 'A digitação existe para separar isto de um clique errado.' }],
      rotuloConfirmar: 'Bloquear rede',
      perigo: true,
      aoConfirmar: async (v) => {
        if (v.confirmar !== rv.revendedorId) {
          return { campo: 'confirmar', mensagem: 'o código não confere' }
        }
        const resp = await api('/admin/revendedor/' + encodeURIComponent(rv.revendedorId) + '/cortar',
          { metodo: 'POST', corpo: { confirmarId: v.confirmar } })
        return resp.ok ? null : { mensagem: resp.erro }
      }
    })
    if (r) await recarregar(rv.revendedorId)
  }

  // ── Lojas ────────────────────────────────────────────────────────────────

  function desenharClientes() {
    const comExcedente = clientes.filter((c) => (c.notas && c.notas.excedentes) > 0)
    const totalNotas = clientes.reduce((s, c) => s + ((c.notas && c.notas.emitidas) || 0), 0)
    const deRevenda = clientes.filter((c) => c.revendedorId).length
    $('cartoesClientes').replaceChildren(
      cartao('Lojas', String(clientes.length), 'store'),
      cartao('De revendedor', String(deRevenda), 'handshake'),
      cartao('Notas no mês', String(totalNotas), 'file-text'),
      // Excedente e o unico numero desta fileira que custa dinheiro a alguem.
      cartao(
        'Acima da cota',
        String(comExcedente.length),
        'triangle-alert',
        comExcedente.length > 0 ? 'alerta' : 'neutro'
      )
    )

    const corpo = $('corpoClientes')
    if (clientes.length === 0) {
      const tr = document.createElement('tr')
      const td = document.createElement('td')
      // 9 = as colunas do <thead> desta tabela. Menos que isso e a mensagem
      // para no meio da largura, com colunas vazias sobrando do lado.
      td.colSpan = 9; td.className = 'vazio'
      td.textContent = 'Nenhuma loja cadastrada.'
      tr.appendChild(td); corpo.replaceChildren(tr)
      return
    }

    corpo.replaceChildren(...clientes.map((cl) => {
      const tr = document.createElement('tr')
      if (destacar === cl.clienteId) tr.className = 'anim-linha-entra'
      const notas = cl.notas || { emitidas: 0, teto: null, excedentes: 0 }

      const tdNome = document.createElement('td')
      const nome = document.createElement('div'); nome.textContent = cl.nome || cl.clienteId
      const id = document.createElement('div'); id.className = 'mono fraco'; id.textContent = cl.clienteId
      tdNome.append(nome, id)

      const tdOrigem = document.createElement('td')
      if (cl.revendedorId) {
        const et = document.createElement('span')
        et.className = 'etiqueta neutra'
        et.appendChild(icone('handshake'))
        et.appendChild(document.createTextNode(cl.revendedorId))
        tdOrigem.appendChild(et)
      } else {
        const dir = document.createElement('span'); dir.className = 'com-icone fraco'
        dir.appendChild(icone('building-2'))
        dir.appendChild(document.createTextNode('FHVP direto'))
        tdOrigem.appendChild(dir)
      }

      const tdPlano = document.createElement('td')
      tdPlano.textContent = cl.plano ? (cl.plano === 'pro' ? 'Pro' : 'Básico') : '—'

      const tdValidade = document.createElement('td')
      tdValidade.textContent = dataBr(cl.validadeAtual)

      // Mensalidade: mostra o valor fixo desta loja, ou o padrao em cinza.
      // Sem esta coluna, o preco combinado com cada cliente so existiria dentro
      // do banco — e a pergunta "quanto o fulano paga?" viraria consulta ao
      // suporte toda vez.
      const tdPreco = document.createElement('td'); tdPreco.className = 'num'
      if (cl.revendedorId) {
        // Loja de revendedor nao paga a FHVP: quem cobra ela e o revendedor, e
        // a rota de renovacao recusa essas lojas. Mostrar um preco aqui seria
        // dizer que cobramos algo que nao cobramos.
        tdPreco.textContent = '—'
        tdPreco.className = 'num fraco'
      } else if (cl.valorCentavosRenovacao) {
        tdPreco.textContent = dinheiro(cl.valorCentavosRenovacao)
      } else {
        tdPreco.textContent = dinheiro(PRECO_PADRAO_CENTAVOS)
        tdPreco.className = 'num fraco'
      }

      const tdNotas = document.createElement('td'); tdNotas.className = 'num'
      tdNotas.textContent = notas.teto === null
        ? String(notas.emitidas)
        : notas.emitidas + ' / ' + notas.teto

      const tdExc = document.createElement('td'); tdExc.className = 'num'
      if (notas.excedentes > 0) {
        const et = document.createElement('span')
        et.className = 'etiqueta alerta'
        // R$0,50 por nota acima da cota — a mesma regra do atacado e do varejo.
        et.textContent = notas.excedentes + ' · ' + dinheiro(notas.excedentes * 50)
        tdExc.appendChild(et)
      } else {
        tdExc.textContent = '—'
        tdExc.className = 'num fraco'
      }

      /**
       * A situacao da loja, em UMA etiqueta.
       *
       * Antes esta coluna so falava de bloqueio e de cota, e mostrava um traco
       * para todo o resto. O problema: loja VENCIDA caia no traco. Num painel
       * cujo trabalho e cuidar de licenca, vencimento e exatamente o que precisa
       * saltar aos olhos, e ele estava invisivel: so aparecia para quem
       * conferisse data por data na coluna do lado.
       *
       * A ordem e de gravidade, e a primeira que casar ganha a etiqueta:
       * bloqueio (alguem decidiu), vencida (parou de funcionar), vence em
       * poucos dias (vai parar), cota travando, e so entao "em dia".
       */
      const tdSit = document.createElement('td')
      const et = document.createElement('span')
      const hojeIso = new Date().toISOString().slice(0, 10)
      const validade = cl.validadeAtual ? String(cl.validadeAtual).slice(0, 10) : null
      const diasAteVencer = validade ? diasEntre(hojeIso, validade) : null

      if (cl.bloqueadoPor) {
        et.className = 'etiqueta erro'
        et.appendChild(icone('lock'))
        et.appendChild(document.createTextNode(
          cl.bloqueadoPor === 'revendedor' ? 'Bloqueada pelo revendedor' : 'Bloqueada'
        ))
      } else if (validade && validade < hojeIso) {
        et.className = 'etiqueta erro'
        et.appendChild(icone('circle-alert'))
        et.appendChild(document.createTextNode('Vencida'))
      } else if (diasAteVencer !== null && diasAteVencer <= 7) {
        // Sete dias e o que da tempo de cobrar antes de a loja parar.
        et.className = 'etiqueta alerta'
        et.appendChild(icone('clock'))
        et.appendChild(document.createTextNode(
          diasAteVencer === 0 ? 'Vence hoje' : 'Vence em ' + diasAteVencer + 'd'
        ))
      } else if (notas.bloqueiaAcimaDoTeto) {
        et.className = 'etiqueta alerta'
        et.appendChild(icone('triangle-alert'))
        et.appendChild(document.createTextNode('Cota trava emissão'))
      } else {
        et.className = 'etiqueta ok'
        et.appendChild(icone('circle-check-big'))
        et.appendChild(document.createTextNode('Em dia'))
      }
      tdSit.appendChild(et)

      const tdAcoes = document.createElement('td'); tdAcoes.className = 'acoes'
      tdAcoes.appendChild(menuAcoes([
        { texto: 'Renovar licença', icone: 'refresh-cw', aoClicar: () => modalRenovarCliente(cl) },
        { texto: 'Mensalidade', icone: 'banknote', aoClicar: () => modalPreco(cl) },
        { texto: 'Cota de notas', icone: 'file-text', aoClicar: () => modalCota(cl) },
        '-',
        {
          texto: cl.bloqueadoPor ? 'Desbloquear loja' : 'Bloquear loja',
          icone: cl.bloqueadoPor ? 'lock-open' : 'lock',
          perigo: !cl.bloqueadoPor,
          aoClicar: () => modalBloqueioCliente(cl)
        }
      ]))

      tr.append(tdNome, tdOrigem, tdPlano, tdValidade, tdPreco, tdNotas, tdExc, tdSit, tdAcoes)
      return tr
    }))
  }

  async function modalRenovarCliente(cl) {
    const r = await abrirModal({
      titulo: 'Somar dias à loja',
      subtitulo: (cl.nome || cl.clienteId) + ' — vence em ' + dataBr(cl.validadeAtual),
      aviso: cl.revendedorId
        ? 'Esta loja é do revendedor ' + cl.revendedorId + '. A validade dela nunca passa da validade dele — o servidor corta no teto.'
        : undefined,
      campos: [{ id: 'dias', rotulo: 'Dias a somar', tipo: 'number', valor: 30 }],
      rotuloConfirmar: 'Somar',
      aoConfirmar: async (v) => {
        const dias = Number(v.dias)
        if (!Number.isInteger(dias) || dias <= 0) return { campo: 'dias', mensagem: 'informe um número inteiro de dias' }
        const resp = await api('/admin/cliente/' + encodeURIComponent(cl.clienteId) + '/renovar',
          { metodo: 'POST', corpo: { dias } })
        return resp.ok ? null : { mensagem: resp.erro }
      }
    })
    if (r) await carregarClientes(cl.clienteId)
  }

  /**
   * Preco da mensalidade desta loja.
   *
   * O valor digitado aqui SOBRESCREVE o que o aplicativo pede na hora de gerar
   * o PIX de renovacao — e por isso muda o preco sem release nenhum do app.
   *
   * Digita-se em REAIS, nao em centavos: ninguem negocia mensalidade em
   * centavos, e a rota espera centavos. A conversao mora aqui, num lugar so.
   *
   * Vazio devolve a loja ao padrao, igual a cota faz com o teto de notas.
   */
  async function modalPreco(cl) {
    const atual = cl.valorCentavosRenovacao
    const daRevenda = Boolean(cl.revendedorId)
    const r = await abrirModal({
      titulo: 'Preço da mensalidade',
      subtitulo:
        (cl.nome || cl.clienteId) +
        (atual ? ' — hoje ' + dinheiro(atual) : ' — hoje no padrão de ' + dinheiro(PRECO_PADRAO_CENTAVOS)),
      // A loja de revendedor nem chega a gerar PIX pra FHVP: a rota de
      // renovacao a recusa. Sem este aviso, daria pra "definir o preco" dela e
      // esperar que algo acontecesse — e nada aconteceria, em silencio.
      aviso: daRevenda
        ? 'Esta loja é de revendedor (' + cl.revendedorId + '), e quem cobra dela é ele. ' +
          'Um preço aqui não muda nada: a renovação dela nem passa pela FHVP.'
        : 'Vale da próxima cobrança em diante. Um QR já aberto mantém o valor com que foi criado, até expirar.',
      avisoTipo: daRevenda ? 'erro' : 'alerta',
      campos: [
        { id: 'valor', rotulo: 'Mensalidade (R$)', valor: atual ? (atual / 100).toFixed(2).replace('.', ',') : '',
          dica: 'em branco = padrão',
          ajuda: 'Vazio devolve a loja ao padrão de ' + dinheiro(PRECO_PADRAO_CENTAVOS) +
                 '. Aceita vírgula ou ponto — 149,90 e 149.90 são a mesma coisa.' }
      ],
      rotuloConfirmar: 'Salvar',
      aoConfirmar: async (v) => {
        const bruto = String(v.valor || '').trim()
        const corpo = {}
        if (bruto === '') {
          corpo.valorCentavos = null
        } else {
          // Aceita 149,90 e 149.90. O lojista digita como fala.
          const n = Number(bruto.replace(/\./g, '').replace(',', '.'))
          if (!isFinite(n) || n <= 0) {
            return { campo: 'valor', mensagem: 'informe um valor maior que zero, ou deixe vazio' }
          }
          // Arredonda pra centavo inteiro: 149.999 viraria fracao de centavo e
          // a EfiPay recusaria a cobranca.
          corpo.valorCentavos = Math.round(n * 100)
        }
        const resp = await api('/admin/cliente/' + encodeURIComponent(cl.clienteId) + '/preco',
          { metodo: 'POST', corpo })
        return resp.ok ? null : { mensagem: resp.erro }
      }
    })
    if (r) await carregarClientes(cl.clienteId)
  }

  async function modalCota(cl) {
    const notas = cl.notas || {}
    const r = await abrirModal({
      titulo: 'Cota de notas',
      subtitulo: (cl.nome || cl.clienteId) + ' — ' + (notas.emitidas || 0) + ' emitidas neste mês',
      aviso: 'A cota é régua, não cancela: passar dela NÃO impede de emitir, só marca o excedente. Ligue a trava só se a conversa sobre reajuste não tiver resolvido.',
      campos: [
        { id: 'teto', rotulo: 'Notas incluídas', tipo: 'number', valor: notas.teto == null ? '' : notas.teto,
          dica: 'em branco = padrão', ajuda: 'Vazio devolve ao padrão (100 no varejo, 50 na loja de revendedor no Pro). Zero é outra coisa: nenhuma nota incluída.' },
        { id: 'travar', rotulo: 'Travar ao estourar? (sim/não)', valor: notas.bloqueiaAcimaDoTeto ? 'sim' : 'não' }
      ],
      rotuloConfirmar: 'Salvar',
      aoConfirmar: async (v) => {
        const corpo = {}
        if (v.teto === '') corpo.teto = null
        else {
          const n = Number(v.teto)
          if (!Number.isInteger(n) || n < 0) return { campo: 'teto', mensagem: 'informe um inteiro ≥ 0, ou deixe vazio' }
          corpo.teto = n
        }
        const sim = /^(s|sim|1|true)$/i.test(v.travar)
        const nao = /^(n|nao|não|0|false)$/i.test(v.travar)
        if (!sim && !nao) return { campo: 'travar', mensagem: 'responda sim ou não' }
        corpo.bloquear = sim
        const resp = await api('/admin/cliente/' + encodeURIComponent(cl.clienteId) + '/cota',
          { metodo: 'POST', corpo })
        return resp.ok ? null : { mensagem: resp.erro }
      }
    })
    if (r) await carregarClientes(cl.clienteId)
  }

  async function modalBloqueioCliente(cl) {
    const bloqueando = !cl.bloqueadoPor
    const r = await abrirModal({
      titulo: bloqueando ? 'Bloquear a loja?' : 'Desbloquear a loja?',
      subtitulo: cl.nome || cl.clienteId,
      aviso: bloqueando
        ? 'A licença atual dela continua valendo até ' + dataBr(cl.validadeAtual) + '. O bloqueio é sobre o PRÓXIMO ciclo — em sistema que valida offline, a data é a única lei.'
        : (cl.bloqueadoPor === 'revendedor'
            ? 'Este bloqueio foi posto pelo revendedor. Desfazê-lo aqui passa por cima da decisão dele.'
            : 'A loja volta a poder renovar.'),
      avisoTipo: bloqueando ? 'alerta' : 'ok',
      campos: bloqueando ? [{ id: 'motivo', rotulo: 'Motivo' }] : [],
      rotuloConfirmar: bloqueando ? 'Bloquear' : 'Desbloquear',
      perigo: bloqueando,
      aoConfirmar: async (v) => {
        const resp = await api('/admin/cliente/' + encodeURIComponent(cl.clienteId) + '/bloqueio',
          { metodo: 'POST', corpo: { bloqueado: bloqueando, por: 'fhvp', motivo: v.motivo || undefined } })
        return resp.ok ? null : { mensagem: resp.erro }
      }
    })
    if (r) await carregarClientes(cl.clienteId)
  }

  /**
   * Retoma a sessão ao abrir a página.
   *
   * É o que faz o F5 deixar de expulsar quem já entrou — o incômodo que motivou
   * trocar o token colado à mão por um login de verdade. Se a sessão não valer
   * mais (12h, deploy, senha trocada), o 401 dentro do `api()` já devolve para a
   * tela de entrada; aqui basta não seguir.
   */
  if (token) {
    abrirPainel().catch(() => {})
  }
})()
</script>
</body>
</html>
