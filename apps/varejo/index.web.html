<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:" />
    <!--
      Ícone da aba. Caminho relativo, como todo o resto: assim a mesma página
      serve na raiz de um domínio ou num subcaminho, sem recompilar.

      O `.ico` carrega seis tamanhos (16 a 256) e o navegador escolhe o que
      precisa — é o mesmo arquivo do ícone do aplicativo instalado, para a aba
      e o atalho no Windows mostrarem a mesma marca.
    -->
    <link rel="icon" href="./favicon.ico" sizes="any" />
    <!--
      Para quando o lojista fixa a página na tela inicial do tablet. O Android
      quer um ícone grande aqui; sem ele, o sistema recorta o favicon de 32px e
      o resultado fica borrado no meio da tela.
    -->
    <link rel="apple-touch-icon" href="./icone-512.png" />
    <!--
      Manifesto: é o que faz "adicionar à tela inicial" virar um atalho que abre
      SEM a barra do navegador, com cara de aplicativo.

      Vale a pena num caixa: a barra come altura de tela e o botão de voltar
      dela é justamente o que tira o lojista do sistema por reflexo. O gesto de
      voltar do Android continua existindo, e continua sendo tratado — ver
      web/GuardaDoVoltar.tsx.

      A orientação NÃO é travada de propósito: o tablet trabalha deitado no
      balcão, mas nada impede o lojista de girar.
    -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <!--
      A cor da barra de status do Android enquanto o sistema está aberto. É o
      mesmo tom da barra lateral, para a emenda não aparecer.
    -->
    <meta name="theme-color" content="#0f172a" />
    <title>FHVP Tech</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.web.tsx"></script>
  </body>
</html>
